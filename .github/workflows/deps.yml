name: deps

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "crates/*/Cargo.toml"
      - ".github/workflows/deps.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    name: licence, source and advisory policy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          manifest-path: Cargo.toml
          deny-path: deny.toml
          command: check advisories bans licenses sources
          arguments: --all-features --locked

  result:
    name: result
    needs: [deny]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/result
        with:
          title: deps
          needs: ${{ toJSON(needs) }}
